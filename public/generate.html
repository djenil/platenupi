<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/logo.png?v=1">
  <!-- Primary Meta Tags -->
  <title>Platen UPI — Free UPI QR Code Generator & Desk Standee Typesetter</title>
  <meta name="title" content="Platen UPI — Free UPI QR Code Generator & Desk Standee Typesetter" />
  <meta name="description" content="Generate NPCI-compliant UPI payment QR codes and export printable counter standees. Compatible with Google Pay, PhonePe, Paytm, BHIM, and CRED." />
  <meta name="keywords" content="UPI QR code generator, print UPI standee, UPI payment barcode, NPCI static QR, BharatPe alternative, desk payment card maker" />
  <meta name="author" content="Platen UPI" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://platenupi.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://platenupi.com/" />
  <meta property="og:title" content="Platen UPI — Free UPI QR Code Generator & Desk Standee Typesetter" />
  <meta property="og:description" content="Generate NPCI-compliant UPI payment QR codes and export printable counter standees. Zero commission, client-side, instant." />
  <meta property="og:image" content="https://platenupi.com/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Platen UPI — Free UPI QR Code Generator" />
  <meta name="twitter:description" content="Design and export custom print-ready UPI payment desk standees in seconds." />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Platen UPI",
    "operatingSystem": "All",
    "applicationCategory": "BusinessApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    },
    "description": "Client-side NPCI-compliant UPI payment barcode and counter standee layout generator."
  }
  </script>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --panel: #111114;
      --panel-elevated: #18181c;
      --border: #26262c;
      --border-focus: #52525e;
      --text: #f4f4f7;
      --text-muted: #8b8b99;
      --text-dim: #4c4c57;
      --accent: #ffffff;
      --accent-invert: #09090b;
      --valid: #10b981;
      --invalid: #f43f5e;
      --mono: 'Geist Mono', monospace;
      --sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .main-wrap {
      width: 100%;
      max-width: 880px;
    }

    .container {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 340px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    @media (max-width: 820px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .editor {
      padding: 28px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    h1.brand-title {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: -0.01em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1.brand-title::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
    }

    .badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--panel-elevated);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label.field-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .status-valid { color: var(--valid); }
    .status-invalid { color: var(--invalid); }

    .input-shell {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color 0.15s;
    }

    .input-shell:focus-within {
      border-color: var(--border-focus);
    }

    .currency-symbol {
      padding-left: 12px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    input, select {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.88rem;
      padding: 10px 12px;
    }

    select {
      background: var(--bg);
      cursor: pointer;
    }

    select option {
      background: var(--panel-elevated);
      color: var(--text);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .chips-group {
      display: flex;
      gap: 5px;
      margin-top: 4px;
    }

    .chip-btn {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .chip-btn:hover {
      color: var(--text);
      border-color: var(--border-focus);
    }

    details {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 4px;
    }

    details summary {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
    }

    details summary::after { content: '+'; }
    details[open] summary::after { content: '−'; }

    .drawer-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 14px;
    }

    /* Right Preview Stage */
    .preview-stage {
      padding: 28px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .standee-card {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border-radius: 6px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid #e0e0e0;
    }

    .standee-header {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .standee-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 3px;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .standee-amount {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 4px;
      color: var(--valid);
      display: none;
    }

    .qr-mount {
      margin: 16px 0 12px;
      padding: 12px;
      background: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-mount canvas,
    .qr-mount img {
      display: block;
    }

    .standee-vpa {
      font-family: var(--mono);
      font-size: 0.72rem;
      opacity: 0.8;
      word-break: break-all;
    }

    .standee-footer {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      opacity: 0.45;
      margin-top: 14px;
      text-transform: uppercase;
    }

    .command-matrix {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: var(--accent-invert);
      border: none;
      padding: 10px 14px;
      border-radius: 5px;
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #e4e4e7;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-ghost {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 5px;
      font-family: var(--sans);
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--border-focus);
    }

    .uri-strip {
      width: 100%;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 8px;
      text-align: center;
      cursor: pointer;
    }

    .uri-strip:hover {
      color: var(--text-muted);
    }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; }
      .editor, .command-matrix, .uri-strip, .header-bar { display: none !important; }
      .container { border: none !important; background: transparent !important; display: block !important; }
      .preview-stage { background: transparent !important; padding: 0 !important; }
      .standee-card {
        border: 2px solid #000000 !important;
        color: #000000 !important;
        background: #ffffff !important;
        width: 340px !important;
        margin: 40px auto !important;
      }
    }
  </style>
</head>
<body>

  <main class="main-wrap">
    <div class="container">
      <section class="editor">
        <header class="header-bar">
          <h1 class="brand-title">platen upi</h1>
          <span class="badge">NPCI Standard</span>
        </header>

        <div class="field">
          <label for="pa" class="field-label">
            <span>Payee VPA (UPI ID) *</span>
            <span id="vpaStatus"></span>
          </label>
          <div class="input-shell">
            <input type="text" id="pa" placeholder="store@okhdfcbank" autocomplete="off" spellcheck="false" required />
          </div>
        </div>

        <div class="field">
          <label for="pn" class="field-label">Merchant / Payee Name *</label>
          <div class="input-shell">
            <input type="text" id="pn" placeholder="Studio Acme" autocomplete="off" required />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="am" class="field-label">Amount (INR)</label>
            <div class="input-shell">
              <span class="currency-symbol">₹</span>
              <input type="number" id="am" placeholder="0.00" min="1" step="0.01" />
            </div>
            <div class="chips-group">
              <button type="button" class="chip-btn" onclick="setPresetAmt(100)">100</button>
              <button type="button" class="chip-btn" onclick="setPresetAmt(500)">500</button>
              <button type="button" class="chip-btn" onclick="setPresetAmt(1000)">1k</button>
              <button type="button" class="chip-btn" onclick="setPresetAmt('')">Clear</button>
            </div>
          </div>

          <div class="field">
            <label for="tn" class="field-label">Transaction Note</label>
            <div class="input-shell">
              <input type="text" id="tn" placeholder="Bill or memo" maxlength="40" />
            </div>
          </div>
        </div>

        <details>
          <summary>Invoice Identifiers</summary>
          <div class="drawer-body">
            <div class="grid-2">
              <div class="field">
                <label for="tr" class="field-label">Invoice Ref (TR)</label>
                <div class="input-shell">
                  <input type="text" id="tr" placeholder="INV-001" maxlength="35" />
                </div>
              </div>
              <div class="field">
                <label for="mc" class="field-label">MCC Code</label>
                <div class="input-shell">
                  <select id="mc">
                    <option value="">Personal / None</option>
                    <option value="5411">5411 Grocery</option>
                    <option value="5812">5812 Dining</option>
                    <option value="5691">5691 Retail</option>
                    <option value="8299">8299 Education</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </details>
      </section>

      <section class="preview-stage">
        <div class="standee-card" id="standeePreview">
          <div class="standee-header">Scan to Pay via Any UPI App</div>
          <div class="standee-title" id="previewName">Studio Acme</div>
          <div class="standee-amount" id="previewAmount">₹0.00</div>

          <div class="qr-mount" id="qrMount"></div>

          <div class="standee-vpa" id="previewVpa">merchant@upi</div>
          <div class="standee-footer">BHIM • GPAY • PHONEPE • PAYTM • CRED</div>
        </div>

        <div class="command-matrix">
          <button type="button" class="btn-primary" onclick="exportStandeePNG()">Export Standee (PNG)</button>
          <div class="btn-row">
            <button type="button" class="btn-ghost" onclick="downloadBareQR()">Bare QR Only</button>
            <button type="button" class="btn-ghost" onclick="copyUPIString()">Copy Link</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn-ghost" onclick="window.print()">Print (4×6)</button>
            <button type="button" class="btn-ghost" id="shareBtn" onclick="shareIntent()" style="display: none;">Share</button>
          </div>
          <div class="uri-strip" id="uriFootnote" title="Click to copy URI" onclick="copyUPIString()">
            upi://pay?cu=INR
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const UPI_PATTERN = /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/;

    const paInput = document.getElementById('pa');
    const pnInput = document.getElementById('pn');
    const amInput = document.getElementById('am');
    const tnInput = document.getElementById('tn');
    const trInput = document.getElementById('tr');
    const mcInput = document.getElementById('mc');

    const previewName = document.getElementById('previewName');
    const previewAmount = document.getElementById('previewAmount');
    const previewVpa = document.getElementById('previewVpa');
    const vpaStatus = document.getElementById('vpaStatus');
    const uriFootnote = document.getElementById('uriFootnote');
    const qrMount = document.getElementById('qrMount');
    const shareBtn = document.getElementById('shareBtn');

    if (navigator.share) shareBtn.style.display = 'inline-block';

    function compileUPIString() {
      const vpa = paInput.value.trim();
      if (!vpa) return '';

      const q = new URLSearchParams();
      q.append('pa', vpa);
      if (pnInput.value.trim()) q.append('pn', pnInput.value.trim());
      if (mcInput.value) q.append('mc', mcInput.value);
      if (trInput.value.trim()) q.append('tr', trInput.value.trim());
      if (tnInput.value.trim()) q.append('tn', tnInput.value.trim());
      
      const parsedAmt = parseFloat(amInput.value);
      if (!isNaN(parsedAmt) && parsedAmt > 0) {
        q.append('am', parsedAmt.toFixed(2));
      }
      q.append('cu', 'INR');
      return `upi://pay?${q.toString()}`;
    }

    function renderQR() {
      const vpa = paInput.value.trim();
      const name = pnInput.value.trim() || 'Desk Counter';
      const parsedAmt = parseFloat(amInput.value);
      const payload = compileUPIString();

      previewName.textContent = name;
      previewVpa.textContent = vpa || 'id@bank';

      if (!isNaN(parsedAmt) && parsedAmt > 0) {
        previewAmount.style.display = 'block';
        previewAmount.textContent = `₹${parsedAmt.toFixed(2)}`;
      } else {
        previewAmount.style.display = 'none';
      }

      if (!vpa) {
        vpaStatus.textContent = '';
      } else if (!UPI_PATTERN.test(vpa)) {
        vpaStatus.className = 'status-invalid';
        vpaStatus.textContent = 'Invalid ID';
      } else {
        vpaStatus.className = 'status-valid';
        vpaStatus.textContent = 'Valid';
      }

      uriFootnote.textContent = payload || 'upi://pay?cu=INR';
      qrMount.innerHTML = '';

      if (payload) {
        new QRCode(qrMount, {
          text: payload,
          width: 170,
          height: 170,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    function setPresetAmt(val) {
      amInput.value = val;
      renderQR();
    }

    function copyUPIString() {
      const payload = compileUPIString();
      if (!payload) return;
      navigator.clipboard.writeText(payload).then(() => {
        const prev = uriFootnote.textContent;
        uriFootnote.textContent = 'Copied to clipboard';
        setTimeout(() => { uriFootnote.textContent = prev; }, 1400);
      });
    }

    function shareIntent() {
      const payload = compileUPIString();
      if (navigator.share && payload) {
        navigator.share({
          title: pnInput.value || 'UPI QR',
          text: `UPI Payment Link: ${payload}`,
          url: payload
        }).catch(() => {});
      }
    }

    function downloadBareQR() {
      const canvas = qrMount.querySelector('canvas');
      const img = qrMount.querySelector('img');
      const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
      if (!src) return;

      const link = document.createElement('a');
      link.download = `UPI-Bare-QR-${Date.now()}.png`;
      link.href = src;
      link.click();
    }

    function exportStandeePNG() {
      const qrCanvas = qrMount.querySelector('canvas');
      if (!qrCanvas) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 640;
      canvas.height = 880;

      // Card Base
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      // Top Tag
      ctx.fillStyle = '#666666';
      ctx.font = '600 13px monospace';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      ctx.fillText('SCAN TO PAY VIA ANY UPI APP', canvas.width / 2, 85);

      // Merchant Name
      ctx.fillStyle = '#000000';
      ctx.font = '700 30px sans-serif';
      ctx.fillText(pnInput.value.trim() || 'Desk Counter', canvas.width / 2, 135);

      // Amount Display
      const parsedAmt = parseFloat(amInput.value);
      if (!isNaN(parsedAmt) && parsedAmt > 0) {
        ctx.fillStyle = '#10b981';
        ctx.font = '600 24px monospace';
        ctx.fillText(`₹${parsedAmt.toFixed(2)}`, canvas.width / 2, 175);
      }

      // Draw Clean QR Code Plate
      const qrSize = 340;
      const qrX = (canvas.width - qrSize) / 2;
      const qrY = 215;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(qrX - 16, qrY - 16, qrSize + 32, qrSize + 32);
      ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);

      // UPI Address
      ctx.fillStyle = '#333333';
      ctx.font = '500 18px monospace';
      ctx.fillText(paInput.value.trim(), canvas.width / 2, 630);

      // Footer
      ctx.fillStyle = '#888888';
      ctx.font = '600 12px monospace';
      ctx.letterSpacing = '1px';
      ctx.fillText('BHIM • GPAY • PHONEPE • PAYTM • CRED', canvas.width / 2, 750);

      ctx.font = '400 11px sans-serif';
      ctx.fillText('NPCI Unified Payments Interface Standard', canvas.width / 2, 780);

      const link = document.createElement('a');
      link.download = `Platen-UPI-Standee-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    [paInput, pnInput, amInput, tnInput, trInput, mcInput].forEach(el => {
      el.addEventListener('input', renderQR);
    });

    window.addEventListener('DOMContentLoaded', () => {
      paInput.value = 'store@okhdfcbank';
      pnInput.value = 'Studio Acme';
      renderQR();
    });
  </script>
</body>
</html>
